config_version = "app-config.v1"

[paths]
data_dir = "data"
database_path = "data/race_engineer.sqlite3"

[runtime]
queue_capacity = 128
component_timeout_s = 2.0
shutdown_timeout_s = 5.0

[logging]
level = "INFO"
format = "console"

[privacy]
record_raw_telemetry = false
record_generator_prompts = false
record_generator_outputs = false
# Local diagnostic transcripts and grounded replies for the next radio test.
# Set false to keep stage timings/routing without conversation text.
record_radio_text = true

[history]
enabled = true
retention_days = 30

[telemetry.iracing]
sample_rate_hz = 10.0
reconnect_delay_s = 2.0
include_replay = false
slow_read_warning_s = 0.05
sample_gap_warning_s = 0.25

[policy.context]
event_history_limit = 32
fuel_trend_laps = 5
fuel_increase_reset_l = 0.25
battle_gap_s = 1.5

[policy.strict]
max_intents_per_frame = 1
routine_cooldown_s = 15.0
important_cooldown_s = 5.0
critical_cooldown_s = 0.0
announce_position_changes = true
announce_pit_transitions = false
max_words = 20
language = "en"

[language]
adapter = "deterministic"

[tts]
enabled = true
adapter = "chatterbox"
python_path = "data/tts-chatterbox/runtime/Scripts/python.exe"
model_path = "data/components/tts/chatterbox/5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18"
# Prefer CUDA when usable; CPU fallback is announced and may be too slow for racing.
device = "auto"
fallback_to_cpu = true
volume = 0.8
threads = 4
startup_timeout_s = 180.0
playback_timeout_s = 120.0
shutdown_timeout_s = 5.0
queue_capacity = 8
# output_device = 4  # Applies to ALL speech and PTT cues; omitted uses system default.

[conversation]
adapter = "llama-cpp"
# V7 is the development/live-test default; set v6 explicitly for rollback.
context_planner = "qwen-context-v7"
model = "Qwen3-4B-Instruct-2507"
port = 8088
timeout_s = 30.0
history_turns = 6
max_snapshot_age_s = 3.0
default_language = "en"

# Main edition: Qwen context planning and replies run on NVIDIA/CUDA.
# STT remains CPU-only; Chatterbox selects its device independently. CPU Qwen is explicit;
# do not silently reuse an external CPU server or fall back during a GPU session.
[conversation.runtime]
mode = "gpu"
cpu_executable_path = "data/conversation-prototype/llama-b10964-cpu/llama-server.exe"
accelerated_executable_path = "data/conversation-prototype/llama-b10964-cuda-13.3/llama-server.exe"
accelerated_backend = "cuda"
device = "CUDA0"
model_path = "data/conversation-prototype/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
runtime_revision = "b10964"
model_revision = "a06e946bb6b655725eafa393f4a9745d460374c9"
quantization = "Q4_K_M"
threads = 8
context_size = 8192
parallel = 1
gpu_layers = -1
fallback_to_cpu = false
reuse_external_server = false
probe_timeout_s = 5.0
startup_timeout_s = 120.0
shutdown_timeout_s = 5.0

[stt]
adapter = "qwen3-asr"
python_path = "data/stt-prototype/runtime/Scripts/python.exe"
model_path = "data/stt-prototype/Qwen3-ASR-0.6B-hf"
device = "cpu"
threads = 8
language = "auto"
startup_timeout_s = 120.0
timeout_s = 45.0
sample_rate_hz = 16000
ptt_key = "F8"
max_capture_s = 15.0
min_capture_s = 0.2
silence_threshold_dbfs = -42.0
# input_device = 1  # choose an index from list-input-devices; otherwise system default
