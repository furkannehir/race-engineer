config_version = "app-config.v1"

[paths]
data_dir = "data"
database_path = "data/race_engineer.sqlite3"

[runtime]
queue_capacity = 128
component_timeout_s = 2.0
shutdown_timeout_s = 5.0

[logging]
level = "INFO"
format = "console"

[privacy]
record_raw_telemetry = false
record_generator_prompts = false
record_generator_outputs = false

[telemetry.iracing]
sample_rate_hz = 10.0
reconnect_delay_s = 2.0
include_replay = false
slow_read_warning_s = 0.05
sample_gap_warning_s = 0.25

[policy.context]
event_history_limit = 32
fuel_trend_laps = 5
fuel_increase_reset_l = 0.25
battle_gap_s = 1.5

[policy.strict]
max_intents_per_frame = 1
routine_cooldown_s = 15.0
important_cooldown_s = 5.0
critical_cooldown_s = 0.0
announce_position_changes = true
announce_pit_transitions = false
max_words = 20
language = "en"

[language]
adapter = "deterministic"

[tts]
enabled = true
adapter = "windows-sapi"
rate = 0
volume = 100
playback_timeout_s = 10.0
queue_capacity = 8

[conversation]
adapter = "llama-cpp"
model = "Qwen3-4B-Instruct-2507"
port = 8087
timeout_s = 30.0
history_turns = 6
max_snapshot_age_s = 3.0
default_language = "en"

[stt]
adapter = "qwen3-asr"
python_path = "data/stt-prototype/runtime/Scripts/python.exe"
model_path = "data/stt-prototype/Qwen3-ASR-0.6B-hf"
device = "cpu"
threads = 8
language = "auto"
startup_timeout_s = 120.0
timeout_s = 45.0
sample_rate_hz = 16000
ptt_key = "F8"
max_capture_s = 15.0
min_capture_s = 0.2
silence_threshold_dbfs = -42.0
# input_device = 1  # choose an index from list-input-devices; otherwise system default

# Conversational replies only; [tts] still controls automatic iRacing calls.
[radio_tts]
enabled = true
adapter = "piper"
python_path = "data/tts-prototype/runtime/Scripts/python.exe"
english_model_path = "data/tts-prototype/voices/en_US-ljspeech-high.onnx"
turkish_model_path = "data/tts-prototype/voices/tr_TR-dfki-medium.onnx"
volume = 0.8
length_scale = 1.0
threads = 4
startup_timeout_s = 60
playback_timeout_s = 90
# output_device = 4  # See list-output-devices; omitted uses system default.
