config_version = "app-config.v1"

[paths]
data_dir = "data"
database_path = "data/race_engineer.sqlite3"

[runtime]
queue_capacity = 128
component_timeout_s = 2.0
shutdown_timeout_s = 5.0

[logging]
level = "INFO"
format = "console"

[privacy]
record_raw_telemetry = false
record_generator_prompts = false
record_generator_outputs = false
# Local diagnostic transcripts and grounded replies for the next radio test.
# Set false to keep stage timings/routing without conversation text.
record_radio_text = true

[history]
enabled = true
retention_days = 30

[telemetry.iracing]
sample_rate_hz = 10.0
reconnect_delay_s = 2.0
include_replay = false
slow_read_warning_s = 0.05
sample_gap_warning_s = 0.25

[policy.context]
event_history_limit = 32
fuel_trend_laps = 5
fuel_increase_reset_l = 0.25
battle_gap_s = 1.5

[policy.strict]
max_intents_per_frame = 1
routine_cooldown_s = 15.0
important_cooldown_s = 5.0
critical_cooldown_s = 0.0
announce_position_changes = true
announce_pit_transitions = false
max_words = 20
language = "en"

[language]
adapter = "deterministic"

[tts]
enabled = true
adapter = "chatterbox"
python_path = "data/tts-chatterbox/runtime/Scripts/python.exe"
model_path = "data/components/tts/chatterbox/5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18"
# Prefer CUDA when usable; CPU fallback is announced and may be too slow for racing.
device = "auto"
# BF16 T3 on supported CUDA; FP32 decoder and CPU. Set "fp32" for rollback.
precision = "auto"
fallback_to_cpu = true
volume = 0.8
threads = 4
startup_timeout_s = 180.0
playback_timeout_s = 120.0
shutdown_timeout_s = 5.0
queue_capacity = 8
# output_device = 4  # Applies to ALL speech and PTT cues; omitted uses system default.

[conversation]
adapter = "llama-cpp"
# English MVP: one resident LFM model selects native tools and writes grounded replies.
# Explicit Qwen rollback: --config config/qwen-legacy.toml.
context_planner = "lfm3-native-v1"
model = "LiquidAI/LFM3-1.7B"
port = 8092
timeout_s = 30.0
history_turns = 6
max_snapshot_age_s = 3.0
# Queue + speech preparation budget. Latest live telemetry must still be fresh.
reply_delivery_timeout_s = 15.0
default_language = "en"

# LFM runs on NVIDIA/CUDA. Qwen3-ASR stays on CPU; Chatterbox selects its own device.
# CPU LFM is explicit; never silently reuse a different server or switch model/backend.
[conversation.runtime]
mode = "gpu"
cpu_executable_path = "data/lfm3-prototype/llama-b12088-cpu/llama-server.exe"
accelerated_executable_path = "data/lfm3-prototype/llama-b12088-cuda-13.4/llama-server.exe"
accelerated_backend = "cuda"
device = "CUDA0"
model_path = "data/lfm3-prototype/LFM3-1.7B-Q4_K_M.gguf"
runtime_revision = "b12088"
model_revision = "cd0c74c575b5c416f3011b5b4c298077f26ca8c2"
quantization = "Q4_K_M"
threads = 8
context_size = 8192
parallel = 1
gpu_layers = -1
enable_thinking = false
fallback_to_cpu = false
reuse_external_server = false
probe_timeout_s = 5.0
startup_timeout_s = 120.0
shutdown_timeout_s = 5.0

[stt]
adapter = "qwen3-asr"
python_path = "data/stt-prototype/runtime/Scripts/python.exe"
model_path = "data/stt-prototype/Qwen3-ASR-0.6B-hf"
device = "cpu"
threads = 8
language = "auto"
startup_timeout_s = 120.0
timeout_s = 45.0
sample_rate_hz = 16000
ptt_key = "F8"
max_capture_s = 15.0
min_capture_s = 0.2
silence_threshold_dbfs = -42.0
# input_device = 1  # choose an index from list-input-devices; otherwise system default
