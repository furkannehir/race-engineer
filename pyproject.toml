[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "race-engineer"
version = "0.1.0"
description = "Local-first, game-adaptable personalized race engineer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pyirsdk>=1.3.6,<2",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8,<7",
  "QtAwesome==1.4.2",
  "sounddevice>=0.5.3,<0.6",
  "pygame-ce==2.5.8",
]
audio = ["sounddevice>=0.5.3,<0.6"]
radio = ["piper-tts==1.8.0", "sounddevice>=0.5.3,<0.6"]
asr = [
  "transformers==5.17.0",
  "numpy>=2,<3",
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.14",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
race-engineer = "race_engineer.cli:main"

[project.gui-scripts]
race-engineer-panel = "race_engineer.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Turkish radio text uses dotless i intentionally.
allowed-confusables = ["ı"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["race_engineer"]
