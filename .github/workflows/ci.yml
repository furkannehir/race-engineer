name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,desktop]"
      - run: python -m pytest
        env:
          # The suite uses pytest built-ins, not plugins preinstalled on the runner.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m ruff check .
      - run: python -m mypy
